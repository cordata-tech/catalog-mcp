name: Release

# Fires on a `v*` tag. The tag is the decision; everything here is mechanical.
#
# Publishes through a trusted publisher on PyPI for `cordata-tech/catalog-mcp`,
# workflow `release.yml`, environment `pypi` — the same arrangement as
# `pipeline-runtime`, with no API token anywhere. The `pypi` environment only
# accepts `v*` tags.
on:
  push:
    tags: ["v*"]
  # A dry run: everything except the upload. A version number on PyPI cannot be
  # used twice, so the workflow is proved before a tag is pushed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ".[dev]"

      - name: The tag matches the version, in both places it is written
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, sys, tomllib
          from importlib.metadata import version
          import catalog_mcp
          tag = os.environ["GITHUB_REF_NAME"]
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          found = {"pyproject.toml": declared, "__version__": catalog_mcp.__version__,
                   "installed": version("cordata-catalog-mcp")}
          wrong = {k: v for k, v in found.items() if f"v{v}" != tag}
          if wrong:
              sys.exit(f"tag {tag} does not match {wrong}")
          print(f"{tag} matches {found}")
          PY

      - name: The changelog has a dated entry for it
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, pathlib, sys
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = next((l for l in lines if l.startswith(f"## {version}")), None)
          if heading is None:
              sys.exit(f"CHANGELOG.md has no entry for {version}")
          if "unreleased" in heading.lower():
              sys.exit(f"CHANGELOG.md still marks {version} as unreleased — date it")
          print(f"CHANGELOG.md documents {version}: {heading}")
          PY

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # The wheel in a clean environment, away from the checkout: what
      # `uvx cordata-catalog-mcp` would install. The catalog loading proves
      # columns.json is in the wheel and matches the runtime it pulls in.
      - name: The wheel installs and starts on its own
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/cordata-catalog-mcp --version
          /tmp/clean/bin/python - <<'PY'
          from catalog_mcp.catalog import Catalog
          catalog = Catalog()
          assert len(catalog.datasets) == 3, sorted(catalog.datasets)
          assert len(catalog.sources) == 2, sorted(catalog.sources)
          print("catalog loads", sorted(catalog.datasets), "and sources", sorted(catalog.sources))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a tag publishes; a manual run stops after the build.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
